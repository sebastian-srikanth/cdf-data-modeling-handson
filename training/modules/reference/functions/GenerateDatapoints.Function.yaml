externalId: fnc_{{ participant }}_Training_GenerateDatapoints
name: fnc_{{ participant }}_Training_GenerateDatapoints
owner: Training
description: Write 30 days of hourly datapoints to the six training timeseries.
functionPath: handler.py
runtime: {{ function_runtime }}
dataSetExternalId: {{ dataset }}
envVars:
  PARTICIPANT: "{{ participant }}"
  INSTANCE_SPACE: "{{ instance_space }}"
  SCHEMA_SPACE_EDM: "{{ schema_space_edm }}"
  SCHEMA_SPACE_SDM: "{{ schema_space_sdm }}"
  DATASET: "{{ dataset }}"
  MODEL_VERSION: "{{ model_version }}"
