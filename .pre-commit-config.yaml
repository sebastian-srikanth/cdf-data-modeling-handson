# Templated Toolkit resources under training/modules/reference/ contain
# {{ variable }} placeholders. They are not valid YAML until `cdf build`
# substitutes them, so check-yaml must skip that tree — `cdf build` is what
# actually validates those files.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^training/modules/
      - id: check-added-large-files
        args: [--maxkb=2048]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
