site_name: CDF Data Modeling — Hands On
site_description: A from-zero, hands-on course through Cognite Data Fusion, the Cognite Toolkit, and one deliberately real industrial data model.
docs_dir: docs
repo_url: https://github.com/sebastian-srikanth/cdf-data-modeling-handson
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Start here: README.md
  - For facilitators: FACILITATOR.md
  - Setup:
      - 00 — Bootstrap: 00-bootstrap.md
      - 01 — Naming, isolation and setup: 01-naming-isolation-and-setup.md
      - 02 — Auth and security: 02-auth-and-security.md
  - Build the model:
      - 03 — Data modeling: 03-data-modeling.md
      - 04 — Data sets, RAW and files: 04-data-sets-raw-and-files.md
      - 05 — Transformations: 05-transformations.md
      - 06 — Location filters: 06-location-filters.md
  - Contextualise:
      - 07 — Entity matching: 07-entity-matching.md
      - 08 — Diagram annotation: 08-diagram-annotation.md
      - 09 — 3D: 09-3d.md
      - 10 — Datasheet parsing: 10-datasheet-parsing.md
      - 11 — Datapoints: 11-datapoints.md
      - 12 — Workflows: 12-workflows.md
  - Use it:
      - 13 — Querying the graph: 13-querying-the-graph.md
      - 14 — Debugging broken links: 14-debugging-broken-links.md
      - 15 — Atlas AI agent: 15-atlas-ai-agent.md
  - Govern and finish:
      - 16 — Access management: 16-access-management.md
      - 16 — Cross-cutting mastery: 17-cross-cutting-mastery.md
      - 17 — PR and merge: 18-pr-and-merge.md
      - 18 — Teardown: 19-teardown.md
