name: checks

# Offline only: no credentials, no network calls to CDF. Runs in seconds on every push
# and pull request, and is the gate that stops a chapter silently drifting from the
# reference module it teaches.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Documentation and notebook checks
        run: uv run python tools/check_docs.py

      # Handler decision logic, against fake clients. Fast, and it reaches the cases a
      # live run reaches only by contrivance: the middle confidence band, a human veto,
      # a rule that was deleted, a gate racing the write it checks.
      - name: Handler unit tests
        run: uv run --group dev python -m pytest tests/ -q

      # Installed explicitly, with its browser, so a Chromium problem fails here and
      # visibly rather than looking like six broken diagrams.
      - name: Install mermaid-cli and Chromium
        run: |
          npm install -g @mermaid-js/mermaid-cli@11
          npx puppeteer browsers install chrome-headless-shell

      - name: Mermaid diagrams render
        run: uv run python tools/check_mermaid.py

      - name: Toolkit build (structure only, no CDF verification)
        run: uv run cdf build --config-yaml training/config.REFERENCE-training.yaml
        env:
          CI: "true"
